<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">候选预算与昂贵评分次数</title>
  <desc id="desc">固定候选数 n=3，由合成材料第2节推导 c(k)=k。三个有效点为一一、二二、三三。连线仅辅助阅读，不表示非整数预算可用。</desc>
  <rect width="720" height="420" fill="white"/>
  <g font-family="sans-serif" fill="#172536">
    <text x="55" y="35" font-size="22">候选预算与昂贵评分次数</text>
    <text x="55" y="62" font-size="14">公式推导示意：固定 n=3，c(k)=k；不是实测性能</text>
    <text x="55" y="93" font-size="14">昂贵评分次数 c（次）</text>
    <g stroke="#dbe2e8" stroke-width="1">
      <path d="M100 250H600 M100 180H600 M100 110H600"/>
    </g>
    <path d="M100 105V320H620" fill="none" stroke="#172536" stroke-width="2"/>
    <g font-size="14" text-anchor="end">
      <text x="89" y="325">0</text><text x="89" y="255">1</text>
      <text x="89" y="185">2</text><text x="89" y="115">3</text>
    </g>
    <polyline points="200,250 380,180 560,110" fill="none" stroke="#287bc0" stroke-width="3"/>
    <g fill="#287bc0"><circle cx="200" cy="250" r="6"/><circle cx="380" cy="180" r="6"/><circle cx="560" cy="110" r="6"/></g>
    <g text-anchor="middle" font-size="14">
      <text x="200" y="343">1</text><text x="380" y="343">2</text><text x="560" y="343">3</text>
      <text x="380" y="367">候选预算 k（个；仅整数）</text>
    </g>
    <text x="55" y="398" font-size="13">来源：第2节操作定义。点间连线仅辅助阅读；未推导准确率或延迟趋势。</text>
  </g>
</svg>
